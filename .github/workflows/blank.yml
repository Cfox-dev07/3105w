name: Build IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and Archive
        run: |
          set -e

          ARCHIVE="$RUNNER_TEMP/3105.xcarchive"

          xcodebuild archive \
            -project "ThreeOneOSFive.xcodeproj" \
            -target "3105" \
            -configuration "Release" \
            -sdk iphoneos \
            -archivePath "$ARCHIVE" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=NO \
            SKIP_INSTALL=NO \
            BUILD_LIBRARY_FOR_DISTRIBUTION=NO

      - name: Create IPA
        run: |
          set -e

          ARCHIVE="$RUNNER_TEMP/3105.xcarchive"
          OUT="$RUNNER_TEMP/ipa"
          APP="$ARCHIVE/Products/Applications/3105.app"

          mkdir -p "$OUT/Payload"

          cp -R "$APP" "$OUT/Payload/3105.app"

          cd "$OUT"

          zip -qry \
            "$GITHUB_WORKSPACE/3105-v1.1.1-unsigned.ipa" \
            Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: 3105-v1.1.1-unsigned
          path: 3105-v1.1.1-unsigned.ipa
