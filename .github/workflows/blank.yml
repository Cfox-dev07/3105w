name: Build IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          set -e

          mkdir -p "$RUNNER_TEMP/source"

          ZIP_FILE=$(find . -type f -name "*.zip" -not -path "./.git/*" | head -1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ZIP not found"
            exit 1
          fi

          echo "ZIP: $ZIP_FILE"

          unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/source"

          PROJECT=$(find "$RUNNER_TEMP/source" -type d -name "*.xcodeproj" | head -1)

          if [ -z "$PROJECT" ]; then
            echo "Xcode project not found"
            exit 1
          fi

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

          echo "PROJECT:"
          echo "$PROJECT"

      - name: Create Scheme
        run: |
          set -e

          SCHEME_DIR="$PROJECT/xcshareddata/xcschemes"

          mkdir -p "$SCHEME_DIR"

          SCHEME="$SCHEME_DIR/3105.xcscheme"

          printf '%s\n' \
          '<?xml version="1.0"?>' \
          '<Scheme version="1.3">' \
          '  <BuildAction parallelizeBuildables="YES" buildImplicitDependencies="YES">' \
          '    <BuildActionEntries>' \
          '      <BuildActionEntry buildForTesting="YES" buildForRunning="YES" buildForProfiling="YES" buildForArchiving="YES" buildForAnalyzing="YES">' \
          '        <BuildableReference BuildableIdentifier="primary" BlueprintName="3105" BuildableName="3105.app" BlueprintIdentifier="3105A500" ReferencedContainer="container:ThreeOneOSFive.xcodeproj"/>' \
          '      </BuildActionEntry>' \
          '    </BuildActionEntries>' \
          '  </BuildAction>' \
          '  <TestAction buildConfiguration="Debug"/>' \
          '  <LaunchAction buildConfiguration="Debug"/>' \
          '  <ProfileAction buildConfiguration="Release"/>' \
          '  <AnalyzeAction buildConfiguration="Release"/>' \
          '  <ArchiveAction buildConfiguration="Release"/>' \
          '</Scheme>' \
          > "$SCHEME"

          echo "Scheme created"

      - name: Archive
        run: |
          set -e

          ARCHIVE="$RUNNER_TEMP/3105.xcarchive"

          xcodebuild archive \
            -project "$PROJECT" \
            -scheme "3105" \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$ARCHIVE" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            SKIP_INSTALL=NO

          if [ ! -d "$ARCHIVE" ]; then
            echo "Archive failed"
            exit 1
          fi

          echo "Archive OK"

      - name: Create IPA
        run: |
          set -e

          ARCHIVE="$RUNNER_TEMP/3105.xcarchive"

          APP=$(find "$ARCHIVE/Products/Applications" \
            -maxdepth 1 \
            -type d \
            -name "*.app" \
            | head -1)

          if [ -z "$APP" ]; then
            echo "APP not found"
            find "$ARCHIVE" -maxdepth 5 -print
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/ipa/Payload"

          cp -R "$APP" "$RUNNER_TEMP/ipa/Payload/"

          cd "$RUNNER_TEMP/ipa"

          zip -qry \
            "$GITHUB_WORKSPACE/3105-v1.1.1-unsigned.ipa" \
            Payload

          echo "IPA created"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: 3105-v1.1.1-unsigned
          path: 3105-v1.1.1-unsigned.ipa
          if-no-files-found: error
