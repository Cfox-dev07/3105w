name: Build IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Locate Xcode project
        shell: bash
        run: |
          set -e

          PROJECT=$(find "$GITHUB_WORKSPACE" \
            -type d \
            -name "ThreeOneOSFive.xcodeproj" \
            -print -quit)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: ThreeOneOSFive.xcodeproj not found."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PROJECT")"

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project:"
          echo "$PROJECT"

      - name: Create shared scheme
        shell: bash
        run: |
          set -e

          SCHEME_DIR="$PROJECT/xcshareddata/xcschemes"

          mkdir -p "$SCHEME_DIR"

          cat > "$SCHEME_DIR/3105.xcscheme" <<'EOF'
<?xml version="1.0" encoding="UTF-8"?>
<Scheme
   LastUpgradeVersion = "1540"
   version = "1.3">

   <BuildAction
      parallelizeBuildables = "YES"
      buildImplicitDependencies = "YES">

      <BuildActionEntries>

         <BuildActionEntry
            buildForTesting = "YES"
            buildForRunning = "YES"
            buildForProfiling = "YES"
            buildForArchiving = "YES"
            buildForAnalyzing = "YES">

            <BuildableReference
               BuildableIdentifier = "primary"
               BlueprintIdentifier = "3105A500"
               BuildableName = "3105.app"
               BlueprintName = "3105"
               ReferencedContainer = "container:ThreeOneOSFive.xcodeproj">
            </BuildableReference>

         </BuildActionEntry>

      </BuildActionEntries>

   </BuildAction>

   <TestAction
      buildConfiguration = "Debug"
      selectedDebuggerIdentifier = "Xcode.DebuggerFoundation.Debugger.LLDB"
      selectedLauncherIdentifier = "Xcode.DebuggerFoundation.Launcher.LLDB"
      shouldUseLaunchSchemeArgsEnv = "YES">

   </TestAction>

   <LaunchAction
      buildConfiguration = "Debug"
      selectedDebuggerIdentifier = "Xcode.DebuggerFoundation.Debugger.LLDB"
      selectedLauncherIdentifier = "Xcode.DebuggerFoundation.Launcher.LLDB"
      launchStyle = "0"
      useCustomWorkingDirectory = "NO"
      ignoresPersistentStateOnLaunch = "NO"
      debugDocumentVersioning = "YES"
      debugServiceExtension = "internal"
      allowLocationSimulation = "YES">

      <BuildableProductRunnable
         runnableDebuggingMode = "0">

         <BuildableReference
            BuildableIdentifier = "primary"
            BlueprintIdentifier = "3105A500"
            BuildableName = "3105.app"
            BlueprintName = "3105"
            ReferencedContainer = "container:ThreeOneOSFive.xcodeproj">
         </BuildableReference>

      </BuildableProductRunnable>

   </LaunchAction>

   <ProfileAction
      buildConfiguration = "Release"
      shouldUseLaunchSchemeArgsEnv = "YES"
      savedToolIdentifier = ""
      useCustomWorkingDirectory = "NO"
      debugDocumentVersioning = "YES">

      <BuildableProductRunnable
         runnableDebuggingMode = "0">

         <BuildableReference
            BuildableIdentifier = "primary"
            BlueprintIdentifier = "3105A500"
            BuildableName = "3105.app"
            BlueprintName = "3105"
            ReferencedContainer = "container:ThreeOneOSFive.xcodeproj">
         </BuildableReference>

      </BuildableProductRunnable>

   </ProfileAction>

   <AnalyzeAction
      buildConfiguration = "Release">
   </AnalyzeAction>

   <ArchiveAction
      buildConfiguration = "Release"
      revealArchiveInOrganizer = "YES"
      useCustomWorkingDirectory = "NO"
      parallelizeBuildables = "YES">
   </ArchiveAction>

</Scheme>
EOF

          echo "Created:"
          cat "$SCHEME_DIR/3105.xcscheme"

      - name: Verify project and scheme
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          xcodebuild \
            -project "$PROJECT" \
            -list

      - name: Archive
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          ARCHIVE="$RUNNER_TEMP/3105.xcarchive"

          xcodebuild archive \
            -project "$PROJECT" \
            -scheme "3105" \
            -configuration "Release" \
            -sdk iphoneos \
            -archivePath "$ARCHIVE" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=NO \
            SKIP_INSTALL=NO

          if [ ! -d "$ARCHIVE" ]; then
            echo "ERROR: Archive was not created."
            exit 1
          fi

          echo "Archive created:"
          ls -lah "$ARCHIVE"

      - name: Create IPA
        shell: bash
        run: |
          set -e

          ARCHIVE="$RUNNER_TEMP/3105.xcarchive"
          OUT="$RUNNER_TEMP/ipa"

          APP=$(find "$ARCHIVE/Products/Applications" \
            -maxdepth 1 \
            -type d \
            -name "*.app" \
            -print -quit)

          if [ -z "$APP" ]; then
            echo "ERROR: No .app found in archive."

            echo "Archive contents:"
            find "$ARCHIVE" -maxdepth 5 -print

            exit 1
          fi

          echo "Application:"
          echo "$APP"

          mkdir -p "$OUT/Payload"

          cp -R "$APP" "$OUT/Payload/3105.app"

          cd "$OUT"

          /usr/bin/zip \
            -qry \
            "$GITHUB_WORKSPACE/3105-v1.1.1-unsigned.ipa" \
            Payload

          if [ ! -f "$GITHUB_WORKSPACE/3105-v1.1.1-unsigned.ipa" ]; then
            echo "ERROR: IPA was not created."
            exit 1
          fi

          echo "IPA created:"
          ls -lh "$GITHUB_WORKSPACE/3105-v1.1.1-unsigned.ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: 3105-v1.1.1-unsigned
          path: 3105-v1.1.1-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
