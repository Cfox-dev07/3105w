name: Build IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14        # Apple Silicon, Xcode 15+
    timeout-minutes: 30

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────
      - name: Checkout source
        uses: actions/checkout@v4

      # ── 2. Select Xcode ──────────────────────────────────────────────────
      - name: Select Xcode 15
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      # ── 3. Resolve Swift packages (nếu có) ───────────────────────────────
      - name: Resolve packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project ThreeOneOSFive.xcodeproj \
            -scheme ThreeOneOSFive \
            -destination "generic/platform=iOS" \
            || true   # không fail nếu không có SPM

      # ── 4. Archive (ad-hoc, không cần cert thật) ─────────────────────────
      - name: Archive
        run: |
          xcodebuild archive \
            -project ThreeOneOSFive.xcodeproj \
            -scheme ThreeOneOSFive \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/ThreeOneOSFive.xcarchive" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            PRODUCT_BUNDLE_IDENTIFIER="com.apple.mobile.MobileHouseArrest" \
            ONLY_ACTIVE_ARCH=NO \
            | xcpretty || true

      # ── 5. Export IPA ─────────────────────────────────────────────────────
      - name: Export IPA
        run: |
          mkdir -p "$RUNNER_TEMP/export"

          cat > "$RUNNER_TEMP/ExportOptions.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>ad-hoc</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>compileBitcode</key>
            <false/>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/ThreeOneOSFive.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            || true

      # ── 5b. Fallback: pack thủ công nếu exportArchive fail ───────────────
      - name: Pack IPA manually (fallback)
        run: |
          ARCHIVE="$RUNNER_TEMP/ThreeOneOSFive.xcarchive"
          EXPORT="$RUNNER_TEMP/export"

          # Nếu export bước trên đã tạo .ipa thì skip
          if ls "$EXPORT"/*.ipa 2>/dev/null; then
            echo "IPA already exists, skipping manual pack."
            exit 0
          fi

          APP_PATH=$(find "$ARCHIVE/Products/Applications" -name "*.app" | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No .app found in archive"
            ls -la "$ARCHIVE/Products/" || true
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/Payload/"
          mkdir -p "$EXPORT"
          cd "$RUNNER_TEMP"
          zip -r "$EXPORT/3105.ipa" Payload/
          echo "Manual IPA packed at $EXPORT/3105.ipa"

      # ── 6. List output ───────────────────────────────────────────────────
      - name: List export dir
        run: ls -lh "$RUNNER_TEMP/export/"

      # ── 7. Upload artifact ───────────────────────────────────────────────
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: 3105-v1.1.1-ipa
          path: ${{ runner.temp }}/export/*.ipa
          retention-days: 7
          if-no-files-found: error
