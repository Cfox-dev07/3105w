name: Build IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Find Xcode project
        shell: bash
        run: |
          set -e

          PROJECT=$(find "$GITHUB_WORKSPACE" \
            -type d \
            -name "ThreeOneOSFive.xcodeproj" \
            -not -path "*/.git/*" \
            -print -quit)

          if [ -z "$PROJECT" ]; then
            echo "ThreeOneOSFive.xcodeproj not found"
            echo ""
            echo "Files in repository:"
            find "$GITHUB_WORKSPACE" -maxdepth 5 -print
            exit 1
          fi

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

          echo "Found project:"
          echo "$PROJECT"


      - name: Create Scheme
        shell: bash
        run: |
          set -e

          SCHEME_DIR="$PROJECT/xcshareddata/xcschemes"
          SCHEME="$SCHEME_DIR/3105.xcscheme"

          mkdir -p "$SCHEME_DIR"

          printf '%s\n' \
          '<?xml version="1.0" encoding="UTF-8"?>' \
          '<Scheme version="1.3">' \
          '<BuildAction parallelizeBuildables="YES" buildImplicitDependencies="YES">' \
          '<BuildActionEntries>' \
          '<BuildActionEntry buildForTesting="YES" buildForRunning="YES" buildForProfiling="YES" buildForArchiving="YES" buildForAnalyzing="YES">' \
          '<BuildableReference BuildableIdentifier="primary" BlueprintIdentifier="3105A500" BuildableName="3105.app" BlueprintName="3105" ReferencedContainer="container:ThreeOneOSFive.xcodeproj"/>' \
          '</BuildActionEntry>' \
          '</BuildActionEntries>' \
          '</BuildAction>' \
          '<TestAction buildConfiguration="Debug"/>' \
          '<LaunchAction buildConfiguration="Debug"/>' \
          '<ProfileAction buildConfiguration="Release"/>' \
          '<AnalyzeAction buildConfiguration="Release"/>' \
          '<ArchiveAction buildConfiguration="Release" revealArchiveInOrganizer="YES"/>' \
          '</Scheme>' \
          > "$SCHEME"

          echo "Scheme created:"
          cat "$SCHEME"


      - name: Archive
        shell: bash
        run: |
          set -e

          ARCHIVE="$RUNNER_TEMP/3105.xcarchive"

          xcodebuild archive \
            -project "$PROJECT" \
            -scheme "3105" \
            -configuration "Release" \
            -sdk iphoneos \
            -archivePath "$ARCHIVE" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=NO \
            SKIP_INSTALL=NO

          if [ ! -d "$ARCHIVE" ]; then
            echo "Archive was not created"
            exit 1
          fi

          echo "Archive created successfully"


      - name: Create IPA
        shell: bash
        run: |
          set -e

          ARCHIVE="$RUNNER_TEMP/3105.xcarchive"
          IPA_DIR="$RUNNER_TEMP/ipa"

          APP=$(find "$ARCHIVE/Products/Applications" \
            -maxdepth 1 \
            -type d \
            -name "*.app" \
            -print -quit)

          if [ -z "$APP" ]; then
            echo "No app found in archive"
            echo ""
            find "$ARCHIVE" -maxdepth 6 -print
            exit 1
          fi

          echo "App found:"
          echo "$APP"

          rm -rf "$IPA_DIR"

          mkdir -p "$IPA_DIR/Payload"

          cp -R "$APP" "$IPA_DIR/Payload/"

          cd "$IPA_DIR"

          zip -qry \
            "$GITHUB_WORKSPACE/3105-v1.1.1-unsigned.ipa" \
            Payload

          if [ ! -f "$GITHUB_WORKSPACE/3105-v1.1.1-unsigned.ipa" ]; then
            echo "IPA creation failed"
            exit 1
          fi

          echo "IPA created:"
          ls -lh "$GITHUB_WORKSPACE/3105-v1.1.1-unsigned.ipa"


      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: 3105-v1.1.1-unsigned
          path: 3105-v1.1.1-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
